version: '3.8'

services:
  rathod-ai-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rathod_ai_hub_app
    restart: always
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OpenAI__ApiKey="My API Key"
      - OpenAI__GptModel=gpt-6-luna
    volumes:
      - /var/lib/rathod-hub/data:/app/Data

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx_ssl_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - rathod-ai-hub
